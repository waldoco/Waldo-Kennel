version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        exclude-patterns:
          - github.com/pressly/goose/v3
          - golang.org/x/sys
          - modernc.org/sqlite
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend/acp-runtime
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend/src/landing
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packages/cloud-client
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packages/product-ui
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /scripts
    target-branch: beta
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packages/mobile
    target-branch: beta
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
