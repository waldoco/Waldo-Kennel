# Owner-dispatched Codex delegation on the self-hosted Mac.
#
# SECURITY BOUNDARY: a prompt to Codex is code execution as the runner service
# account on the owner's Mac. Dispatch and repository write access are currently
# owner-only. The owner explicitly granted this Codex channel on 2026-09-18.
# Owner-only writer/dispatch policy operationally protects the commit containing
# the selected workflow. A verifier and boundary wrapper loaded from that exact
# workflow commit run outside the candidate checkout. The wrapper itself does not
# request commit
# or push; Codex retains the service account's ambient git/network/HOME authority.
name: owner Codex delegation on self-hosted Mac
run-name: "Codex delegate @ ${{ inputs.commit_sha }}"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for headless Codex execution on the owner's Mac"
        required: true
        type: string
      commit_sha:
        description: "Full 40-hex commit SHA already contained by protected outcome-loop"
        required: true
        type: string
      resume_from:
        description: "Optional prior Codex session UUID to resume"
        required: false
        default: ""
        type: string
      timeout_minutes:
        description: "Codex execution timeout in minutes (1-120)"
        required: true
        default: 45
        type: number

permissions:
  contents: read

concurrency:
  group: owner-codex-delegate-single-runner
  cancel-in-progress: false

jobs:
  codex-delegate:
    name: owner-authorized Codex code execution
    runs-on: [self-hosted, macOS, ARM64, codex]
    timeout-minutes: 125
    steps:
      - name: Check out selected workflow trust anchor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted

      - name: Verify requested commit is protected history
        id: verify
        shell: bash
        working-directory: trusted
        env:
          REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          verified="$(./scripts/ci/verify-package-proof-ref.sh "$REQUESTED_COMMIT_SHA")"
          printf 'commit_sha=%s\n' "$verified" >> "$GITHUB_OUTPUT"

      - name: Check out verified Codex workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.verify.outputs.commit_sha }}
          persist-credentials: false
          path: candidate

      - name: Initialize failure-only upload artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d "$RUNNER_TEMP/waldo-kennel-codex-delegate.failure.XXXXXX")"
          mkdir -m 700 "$root/work-product"
          : > "$root/output.log"
          : > "$root/work-product/git-status.txt"
          : > "$root/work-product/git-diff.patch"
          printf 'Kennel Codex delegation\ncodex_status=not-established\ncapture_status=failed\nproof=failed: trusted wrapper did not publish a validated capture\n' > "$root/diagnostic.log"
          printf 'CODEX_DELEGATE_UPLOAD_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Verify runner-service Codex login
        shell: bash
        run: |
          set -euo pipefail
          command -v codex >/dev/null
          codex --version
          codex login status >/dev/null 2>&1

      - name: Run headless Codex delegation through trusted wrapper
        shell: bash
        env:
          CODEX_DELEGATE_PROMPT: ${{ inputs.prompt }}
          CODEX_DELEGATE_RESUME_FROM: ${{ inputs.resume_from }}
          CODEX_DELEGATE_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: ./trusted/scripts/ci/codex-delegate.sh "$GITHUB_WORKSPACE/candidate"

      - name: Upload full Codex output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CODEX_DELEGATE_UPLOAD_ROOT }}/output.log
            ${{ env.CODEX_DELEGATE_UPLOAD_ROOT }}/diagnostic.log
          if-no-files-found: error
          retention-days: 2

      - name: Upload Codex work product
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-work-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CODEX_DELEGATE_UPLOAD_ROOT }}/work-product
          if-no-files-found: error
          retention-days: 2

      - name: Remove delegation temporary files
        if: always()
        shell: bash
        run: rm -rf "$CODEX_DELEGATE_UPLOAD_ROOT"
