# Binding foundation gate. Local-first CI: scripts/test-foundation.sh remains the
# authoritative gate run locally (`npm run bootstrap && npm run test:foundation`).
# Hosted execution is deliberately requested only when a PR is ready for the
# expensive final gate; ordinary pushes and dependency refreshes must not spend
# Actions minutes by default.
name: foundation

on:
  pull_request:
    branches: [beta]
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
      - name: Bootstrap dependencies
        run: npm run bootstrap
      - name: Foundation gate
        run: npm run test:foundation
