# Full, unsharded backend gate for the reviewed Outcome loop and its explicit
# candidate branches. Iteration shards may run elsewhere; this job preserves
# the monolithic cross-package boundary before promotion.
name: backend-full-suite

on:
  push:
    branches:
      - outcome-loop
      - 'instinct/*candidate*'

permissions:
  contents: read

concurrency:
  group: backend-full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: go-test-full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run the unchanged backend full suite
        working-directory: backend
        run: go test ./... -count=1

  go-test-macos:
    name: go-test-full-macos
    # Runs on outcome-loop AND candidate branches: a darwin-only failure must
    # block promotion, not surface after it. The push trigger already limits
    # this workflow to outcome-loop and instinct/*candidate* refs.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run the unchanged backend full suite on macOS
        working-directory: backend
        run: go test ./... -count=1

  frontend-test:
    name: frontend-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
      - name: Install frontend workspaces
        run: |
          npm --prefix packages/product-ui ci
          npm --prefix frontend ci
      - name: product-ui vitest + tsc
        run: |
          npm --prefix packages/product-ui run test
          npm --prefix packages/product-ui run typecheck
      - name: Frontend canvas + gallery tests
        working-directory: frontend
        run: npx vitest run --config vite.renderer.config.ts src/renderer/lib/mission-canvas-model.test.ts src/renderer/lib/mission-canvas-layout.test.ts src/renderer/components/preview/MissionPrimitivesGallery.test.tsx
      - name: Frontend tsc
        working-directory: frontend
        run: npm run typecheck
