<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d">
<title id="t">Kennel persistent mission runtime</title><desc id="d">Owner and UI feed authenticated commands to the deterministic daemon, coupled through typed events to a Mission Supervisor and through a unified controller to isolated persistent Codex worker sessions.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#e8ecf2}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:14px}.box{fill:#171b22;stroke:#667085;stroke-width:2;rx:14}.accent{fill:#18243a;stroke:#6ea8fe}.green{fill:#14291f;stroke:#57c785}.line{stroke:#9aa4b2;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 6}.small{font-size:12px;fill:#aab3c0}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2"/></marker></defs>
<rect width="1200" height="690" fill="#0c0f14"/><text x="50" y="52" class="title">Kennel persistent mission runtime</text>
<rect x="50" y="90" width="210" height="86" class="box"/><text x="155" y="124" text-anchor="middle" class="h">Owner</text><text x="155" y="150" text-anchor="middle" class="b">Ask · Approve · Watch · Accept</text>
<rect x="330" y="90" width="230" height="86" class="box"/><text x="445" y="124" text-anchor="middle" class="h">One product timeline</text><text x="445" y="150" text-anchor="middle" class="b">Desktop · Web · CLI · plugin</text>
<rect x="630" y="90" width="220" height="86" class="box"/><text x="740" y="124" text-anchor="middle" class="h">S1 authority</text><text x="740" y="150" text-anchor="middle" class="b">authenticated typed commands</text>
<path d="M260 133 H330" class="line"/><path d="M560 133 H630" class="line"/>
<rect x="425" y="240" width="350" height="120" class="box accent"/><text x="600" y="278" text-anchor="middle" class="h">Kernel daemon + durable state</text><text x="600" y="306" text-anchor="middle" class="b">authority · scheduler · custody · checks</text><text x="600" y="330" text-anchor="middle" class="b">recovery · MissionProjection</text><path d="M740 176 L650 240" class="line"/>
<rect x="50" y="250" width="270" height="100" class="box green"/><text x="185" y="284" text-anchor="middle" class="h">Mission Supervisor</text><text x="185" y="310" text-anchor="middle" class="b">one thread / active Plan revision</text><text x="185" y="334" text-anchor="middle" class="small">typed advice + bounded in-scope steering</text>
<path d="M320 280 H425" class="line"/><path d="M425 325 H320" class="line"/>
<rect x="55" y="415" width="300" height="185" class="box"/><text x="205" y="450" text-anchor="middle" class="h">WorkUnit A · Attempt A1</text><text x="205" y="480" text-anchor="middle" class="b">exclusive worktree lease</text><text x="205" y="507" text-anchor="middle" class="b">one Kennel Session</text><text x="205" y="534" text-anchor="middle" class="b">one persistent Codex thread</text><text x="205" y="561" text-anchor="middle" class="small">turn 1 · turn 2 · … · turn N</text>
<rect x="450" y="415" width="300" height="185" class="box"/><text x="600" y="450" text-anchor="middle" class="h">WorkUnit B · Attempt B1</text><text x="600" y="480" text-anchor="middle" class="b">exclusive worktree lease</text><text x="600" y="507" text-anchor="middle" class="b">one Kennel Session</text><text x="600" y="534" text-anchor="middle" class="b">one persistent Codex thread</text><text x="600" y="561" text-anchor="middle" class="small">independent context; publish via daemon</text>
<rect x="845" y="415" width="300" height="185" class="box"/><text x="995" y="450" text-anchor="middle" class="h">WorkUnit C · integration</text><text x="995" y="480" text-anchor="middle" class="b">after serial proof: waits for A + B</text><text x="995" y="507" text-anchor="middle" class="b">exact revisions and artifacts</text><text x="995" y="534" text-anchor="middle" class="b">checks → Result → owner Accept</text><text x="995" y="561" text-anchor="middle" class="small">never receives private transcripts</text>
<path d="M535 360 L250 415" class="line"/><path d="M600 360 V415" class="line"/><path d="M665 360 L950 415" class="line dash"/><path d="M355 548 C400 620 455 620 500 575" class="line dash"/><path d="M700 575 C755 620 810 620 845 548" class="line dash"/>
<text x="600" y="645" text-anchor="middle" class="b">Dashed artifact paths are daemon-verified Plan edges, never worker-to-worker commands. Concurrency follows the serial proof.</text>
</svg>
