components:
  schemas:
    APIError:
      properties:
        code:
          type: string
        details:
          additionalProperties: {}
          type: object
        error:
          type: string
        message:
          type: string
        requestId:
          type: string
      required:
      - error
      - code
      - message
      type: object
    AcceptBatchEnvelope:
      properties:
        batch:
          $ref: '#/components/schemas/AcceptBatchResponse'
      required:
      - batch
      type: object
    AcceptBatchResponse:
      properties:
        accepted:
          items:
            $ref: '#/components/schemas/AcceptanceDecisionResponse'
          type: array
        excluded:
          items:
            $ref: '#/components/schemas/BatchEntryVerdictResponse'
          type: array
        parent:
          $ref: '#/components/schemas/OutcomeProofResponse'
        parentAccepted:
          $ref: '#/components/schemas/AcceptanceDecisionResponse'
      required:
      - accepted
      - excluded
      - parent
      type: object
    AcceptContributorBatchRequest:
      properties:
        acceptParent:
          type: boolean
        expectedContractRevision:
          format: int64
          type: integer
        outcomeIds:
          items:
            type: string
          type: array
        requestKey:
          type: string
        resourceDisposition:
          type: string
        summary:
          type: string
      required:
      - expectedContractRevision
      - summary
      - resourceDisposition
      - requestKey
      type: object
    AcceptanceDecisionResponse:
      properties:
        actorType:
          type: string
        contractRevisionId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        kind:
          type: string
        resourceDisposition:
          type: string
        summary:
          type: string
      required:
      - id
      - contractRevisionId
      - kind
      - actorType
      - summary
      - resourceDisposition
      - createdAt
      type: object
    ActivateConversationBranchResponse:
      properties:
        activeBranchId:
          type: string
      required:
      - activeBranchId
      type: object
    AddProjectInput:
      properties:
        asWorkspace:
          type: boolean
        config:
          $ref: '#/components/schemas/ProjectConfig'
        name:
          type:
          - "null"
          - string
        path:
          type: string
        projectId:
          type:
          - "null"
          - string
      required:
      - path
      type: object
    AgentConfig:
      properties:
        mode:
          type: string
        model:
          type: string
        permissions:
          type: string
        profile:
          type: string
      type: object
    AgentInfo:
      properties:
        authStatus:
          description: Advisory local auth probe result. authorized means a recent
            local probe passed; spawn remains the authoritative validation point.
          enum:
          - authorized
          - unauthorized
          - unknown
          type: string
        id:
          type: string
        label:
          type: string
        ready:
          description: Advisory profile-readiness probe for adapters whose launch
            needs more than an installed binary. Absent means the probe does not apply.
          type:
          - "null"
          - boolean
        readyDetail:
          description: 'Adapter-explained readiness context: what was verified or
            what is missing.'
          type: string
        requiresProfile:
          description: Launch requires user-selected profile configuration beyond
            an installed binary.
          type: boolean
        roles:
          $ref: '#/components/schemas/AgentRoles'
          description: Role admission derived from daemon policy. Clients must not
            re-derive it from provider names.
      required:
      - id
      - label
      - roles
      type: object
    AgentModelInfo:
      properties:
        id:
          type: string
        isDefault:
          type: boolean
        label:
          type: string
        provider:
          type: string
      required:
      - id
      - label
      type: object
    AgentModelsResponse:
      properties:
        agentId:
          type: string
        allowCustom:
          type: boolean
        binaryVersion:
          type: string
        fetchedAt:
          format: date-time
          type: string
        models:
          items:
            $ref: '#/components/schemas/AgentModelInfo'
          type: array
        refreshRecommended:
          type: boolean
        selectionMode:
          enum:
          - catalog
          - text
          - mode
          type: string
        source:
          type: string
        stale:
          type: boolean
        validatedAt:
          format: date-time
          type: string
        warning:
          type: string
      required:
      - agentId
      - selectionMode
      - models
      - allowCustom
      - source
      - fetchedAt
      - stale
      type: object
    AgentRoles:
      properties:
        coordinator:
          type: boolean
        switchTarget:
          type: boolean
        worker:
          type: boolean
      required:
      - worker
      - coordinator
      - switchTarget
